name: test
# The tests run on dev, test and main, and a pull request into any of them runs them before the merge. The image build and smoke test
# (harbor.yml) run on test and main only, and only main publishes.
on:
  push:
    branches: [dev, test, main]
  pull_request:
    branches: [dev, test, main]
  workflow_dispatch:
  # harbor.yml runs these tests before it builds and pushes the image.
  workflow_call:
# Actions are pinned to commit SHAs; the comment names the tag.
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22 }
      - run: cd plugins/quality-code && npm test
      - run: for f in $(git ls-files '*.json'); do node -e "JSON.parse(require('fs').readFileSync('$f','utf8'))" || exit 1; done
      - name: no project values in the plugin's scripts, guides and rules
        run: "! grep -rn -E 'AGT|FIC|teamsystem\\.atlassian|customfield_11707|Giacenza|Magazzino|warehouse' plugins/quality-code/bin plugins/quality-code/lib plugins/quality-code/guides plugins/quality-code/rules"
  mcp-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: '3.12' }
      # Some tests run the plugin's scripts.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22 }
      - run: python -m pip install -e "plugins/quality-code/mcp-server[test]"
      - run: cd plugins/quality-code/mcp-server && python -m pytest -q
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22 }
      - run: cd examples/sample-service && npm ci
      - run: cd plugins/quality-code && QC_E2E=1 node --test "test/e2e/**/*.test.mjs"
  e2e-go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with: { go-version: '1.22', cache: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22 }
      - run: cd plugins/quality-code && QC_E2E=1 node --test test/e2e/go.test.mjs
  e2e-dotnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22 }
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with: { dotnet-version: 8.0.x }
      - run: cd plugins/quality-code && QC_E2E=1 node --test "test/e2e-dotnet/**/*.test.mjs"
  e2e-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: '3.12' }
      - run: python -m pip install pytest
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22 }
      - run: cd plugins/quality-code && QC_E2E=1 node --test "test/e2e-python/**/*.test.mjs" test/pipeline/runners/pytest.test.mjs
  e2e-java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
          # The sample Maven project is written by the test itself: its pom lives in this file.
          cache-dependency-path: plugins/quality-code/test/e2e-java/junit.test.mjs
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22 }
      - run: mvn -v
      - run: cd plugins/quality-code && QC_E2E=1 node --test "test/e2e-java/*.test.mjs"
