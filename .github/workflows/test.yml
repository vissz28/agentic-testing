name: test
on: [push, pull_request]
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: cd plugins/quality-code && npm test
      - run: for f in $(git ls-files '*.json'); do node -e "JSON.parse(require('fs').readFileSync('$f','utf8'))" || exit 1; done
      - name: no project values in the plugin's scripts and guides
        run: "! grep -rn -E 'AGT|FIC|teamsystem\\.atlassian|customfield_11707|Giacenza|Magazzino|warehouse' plugins/quality-code/bin plugins/quality-code/lib plugins/quality-code/guides"
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: cd examples/sample-service && npm ci
      - run: cd plugins/quality-code && QC_E2E=1 node --test "test/e2e/**/*.test.mjs"
  e2e-go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.22', cache: false }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: cd plugins/quality-code && QC_E2E=1 node --test test/e2e/go.test.mjs
  e2e-dotnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: 8.0.x }
      - run: cd plugins/quality-code && QC_E2E=1 node --test "test/e2e-dotnet/**/*.test.mjs"
  e2e-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python -m pip install pytest
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: cd plugins/quality-code && QC_E2E=1 node --test "test/e2e-python/**/*.test.mjs" test/pipeline/runners/pytest.test.mjs
  e2e-java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
          # The sample Maven project is written by the test itself: its pom lives in this file.
          cache-dependency-path: plugins/quality-code/test/e2e-java/junit.test.mjs
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: mvn -v
      - run: cd plugins/quality-code && QC_E2E=1 node --test "test/e2e-java/*.test.mjs"
  mcp-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: cd plugins/quality-code/mcp-server && pip install -e ".[test]" && python -m pytest
