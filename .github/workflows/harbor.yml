# Build the Quality Code MCP server image; on main, publish it to Harbor (harbor.ts-paas.com, project quality), image deploy-server.
# The branch flow: dev is ours (no pipeline), test builds the image and smoke tests it (nothing is published), main publishes.
# Runs on every push to test or main that changes the plugin, and by hand (Actions > "harbor" > Run workflow; a run by hand
# publishes only from main). Harbor keeps only :latest: the new image replaces it when the build and the smoke test pass,
# and the older images are deleted.
# After the push, a second job (main only) points the Azure Container App at the new image and checks it answers. It runs only when the
# Azure settings below are set; without them the image is published and the app is left as it is, with a warning.
#
# Azure (Settings > Secrets and variables > Actions), sign-in by OIDC, no password stored:
#   secrets AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID of an app registration with a federated credential for this repo's main branch
#   and the role Contributor on the Container App's resource group; variables AZURE_RESOURCE_GROUP, AZURE_CONTAINER_APP and QUALITY_CODE_PUBLIC_URL.
# The Container App must already be able to pull from Harbor (az containerapp registry set, once).
#
# Secrets (Settings > Secrets and variables > Actions): HARBOR_USERNAME (the robot account) and HARBOR_PASSWORD.
# Without them the image is still built and smoke tested; the sign-in and the push are skipped, with a warning.
# Optional variables: HARBOR_HOST (default harbor.ts-paas.com) and HARBOR_PROJECT (default quality).
name: harbor

on:
  push:
    branches: [test, main]
    paths: ["plugins/quality-code/**", ".github/workflows/harbor.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: harbor-${{ github.ref }}
  cancel-in-progress: false

env:
  PUBLISH: ${{ github.ref == 'refs/heads/main' }}
  IMAGE: ${{ vars.HARBOR_HOST || 'harbor.ts-paas.com' }}/${{ vars.HARBOR_PROJECT || 'quality' }}/deploy-server
  # A secret cannot be read in an `if`, so whether it is set goes through the environment.
  HAS_HARBOR: ${{ secrets.HARBOR_USERNAME != '' && secrets.HARBOR_PASSWORD != '' }}

jobs:
  image:
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.push.outputs.ref }}
    steps:
      - uses: actions/checkout@v4

      - name: Plugin version
        id: version
        run: echo "value=$(jq -r .version plugins/quality-code/.claude-plugin/plugin.json)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Sign in to Harbor
        if: env.PUBLISH == 'true' && env.HAS_HARBOR == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.HARBOR_HOST || 'harbor.ts-paas.com' }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      # linux/amd64: what a server or an Azure Container App runs (a Mac build is arm64).
      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: plugins/quality-code
          file: plugins/quality-code/mcp-server/Dockerfile
          platforms: linux/amd64
          load: true
          tags: quality-code-mcp:ci
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.value }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The checks of mcp-server/DEPLOY.md, with throwaway Entra values: /health is 200, /mcp without a token is 401.
      - name: Smoke test the image
        run: |
          docker run -d --name qc -p 8000:8000 \
            -e QUALITY_CODE_ENTRA_TENANT_ID=00000000-0000-0000-0000-000000000000 \
            -e QUALITY_CODE_ENTRA_CLIENT_ID=11111111-1111-1111-1111-111111111111 \
            -e QUALITY_CODE_PUBLIC_URL=http://localhost:8000 quality-code-mcp:ci
          for i in $(seq 1 15); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/health || true)
            [ "$code" = "200" ] && break
            sleep 2
          done
          echo "health: $code"
          [ "$code" = "200" ]
          mcp=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:8000/mcp -H 'content-type: application/json' -d '{}')
          echo "mcp without token: $mcp"
          [ "$mcp" = "401" ]

      # Only after the build and the smoke test passed: the new image replaces :latest.
      - name: Push to Harbor (replaces latest)
        id: push
        if: env.PUBLISH == 'true' && env.HAS_HARBOR == 'true'
        run: |
          docker tag quality-code-mcp:ci "$IMAGE:latest"
          docker push "$IMAGE:latest"
          echo "ref=$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE:latest")" >> "$GITHUB_OUTPUT"

      # Harbor keeps one image: every artifact that does not carry the tag latest (the previous latest, now untagged,
      # and any old version tag) is deleted. The robot account needs the "delete artifact" permission on the project;
      # without it this step only warns and the old images stay.
      - name: Delete the old images
        if: env.PUBLISH == 'true' && env.HAS_HARBOR == 'true'
        env:
          HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
          HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
          HOST: ${{ vars.HARBOR_HOST || 'harbor.ts-paas.com' }}
          PROJECT: ${{ vars.HARBOR_PROJECT || 'quality' }}
        run: |
          API="https://$HOST/api/v2.0/projects/$PROJECT/repositories/deploy-server/artifacts"
          json=$(curl -fsS -u "$HARBOR_USERNAME:$HARBOR_PASSWORD" "$API?page_size=100&with_tag=true") || { echo "::warning::could not list the artifacts, old images kept"; exit 0; }
          for digest in $(echo "$json" | jq -r '.[] | select(([.tags[]?.name] | index("latest")) | not) | .digest'); do
            if curl -fsS -o /dev/null -X DELETE -u "$HARBOR_USERNAME:$HARBOR_PASSWORD" "$API/$digest"; then
              echo "deleted $digest"
            else
              echo "::warning::could not delete $digest (the robot account needs the delete artifact permission)"
            fi
          done
          echo "left in Harbor:"
          curl -fsS -u "$HARBOR_USERNAME:$HARBOR_PASSWORD" "$API?page_size=100&with_tag=true" | jq -r '.[] | "\(.digest[0:19])  tags: \([.tags[]?.name] | join(","))"'

      - name: Summary (test)
        if: env.PUBLISH != 'true'
        run: |
          echo "Built and smoke tested on ${GITHUB_REF_NAME} (version ${{ steps.version.outputs.value }}, commit ${GITHUB_SHA::7}). Nothing was published, only main publishes." >> "$GITHUB_STEP_SUMMARY"

      - name: Summary
        if: env.PUBLISH == 'true'
        run: |
          echo "Harbor now holds $IMAGE:latest only (version ${{ steps.version.outputs.value }}, commit ${GITHUB_SHA::7})" >> "$GITHUB_STEP_SUMMARY"

  # The image is in Harbor: point the Container App at it. The image is named by its digest, so the template changes and a new revision starts
  # even though the tag stays latest.
  deploy:
    needs: image
    if: github.ref == 'refs/heads/main' && needs.image.outputs.ref != ''
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      HAS_AZURE: ${{ secrets.AZURE_CLIENT_ID != '' && secrets.AZURE_TENANT_ID != '' && secrets.AZURE_SUBSCRIPTION_ID != '' && vars.AZURE_RESOURCE_GROUP != '' && vars.AZURE_CONTAINER_APP != '' }}
    steps:
      - name: Azure settings missing
        if: env.HAS_AZURE != 'true'
        run: |
          echo "::warning::The image is in Harbor but the Container App was not updated. Set the Azure secrets and variables, see the top of harbor.yml."

      - name: Sign in to Azure
        if: env.HAS_AZURE == 'true'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Update the Container App
        if: env.HAS_AZURE == 'true'
        run: |
          az containerapp update --name "${{ vars.AZURE_CONTAINER_APP }}" --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --image "${{ needs.image.outputs.ref }}" --output none
          echo "Container App ${{ vars.AZURE_CONTAINER_APP }} now runs ${{ needs.image.outputs.ref }}" >> "$GITHUB_STEP_SUMMARY"

      # The checks of mcp-server/DEPLOY.md against the live address: /health is 200 and /mcp without a token is 401.
      - name: Check the live server
        if: env.HAS_AZURE == 'true' && vars.QUALITY_CODE_PUBLIC_URL != ''
        run: |
          URL="${{ vars.QUALITY_CODE_PUBLIC_URL }}"
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$URL/health" || true)
            [ "$code" = "200" ] && break
            sleep 5
          done
          echo "health: $code"
          [ "$code" = "200" ]
          mcp=$(curl -s -o /dev/null -w '%{http_code}' -X POST "$URL/mcp" -H 'content-type: application/json' -d '{}')
          echo "mcp without token: $mcp"
          [ "$mcp" = "401" ]
