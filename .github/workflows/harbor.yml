# Build the Quality Code MCP server image and push it to Harbor (harbor.ts-paas.com, project quality), image deploy-server.
# Runs on every push to main that changes the plugin (each release is one), and by hand. Harbor keeps only :latest:
# the new image replaces it when the build and the smoke test pass, and the older images are deleted. (Actions > "harbor" > Run workflow).
# No Azure here: it only builds the image and pushes it.
#
# Secrets (Settings > Secrets and variables > Actions): HARBOR_USERNAME (the robot account) and HARBOR_PASSWORD.
# Without them the image is still built and smoke tested; the sign-in and the push are skipped, with a warning.
# Optional variables: HARBOR_HOST (default harbor.ts-paas.com) and HARBOR_PROJECT (default quality).
name: harbor

on:
  push:
    branches: [main]
    paths: ["plugins/quality-code/**", ".github/workflows/harbor.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: harbor-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ${{ vars.HARBOR_HOST || 'harbor.ts-paas.com' }}/${{ vars.HARBOR_PROJECT || 'quality' }}/deploy-server
  # A secret cannot be read in an `if`, so whether it is set goes through the environment.
  HAS_HARBOR: ${{ secrets.HARBOR_USERNAME != '' && secrets.HARBOR_PASSWORD != '' }}

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Plugin version
        id: version
        run: echo "value=$(jq -r .version plugins/quality-code/.claude-plugin/plugin.json)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Sign in to Harbor
        if: env.HAS_HARBOR == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.HARBOR_HOST || 'harbor.ts-paas.com' }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      # linux/amd64: what a server or an Azure Container App runs (a Mac build is arm64).
      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: plugins/quality-code
          file: plugins/quality-code/mcp-server/Dockerfile
          platforms: linux/amd64
          load: true
          tags: quality-code-mcp:ci
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.value }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The checks of mcp-server/DEPLOY.md, with throwaway Entra values: /health is 200, /mcp without a token is 401.
      - name: Smoke test the image
        run: |
          docker run -d --name qc -p 8000:8000 \
            -e QUALITY_CODE_ENTRA_TENANT_ID=00000000-0000-0000-0000-000000000000 \
            -e QUALITY_CODE_ENTRA_CLIENT_ID=11111111-1111-1111-1111-111111111111 \
            -e QUALITY_CODE_PUBLIC_URL=http://localhost:8000 quality-code-mcp:ci
          for i in $(seq 1 15); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/health || true)
            [ "$code" = "200" ] && break
            sleep 2
          done
          echo "health: $code"
          [ "$code" = "200" ]
          mcp=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:8000/mcp -H 'content-type: application/json' -d '{}')
          echo "mcp without token: $mcp"
          [ "$mcp" = "401" ]

      # Only after the build and the smoke test passed: the new image replaces :latest.
      - name: Push to Harbor (replaces latest)
        if: env.HAS_HARBOR == 'true'
        run: |
          docker tag quality-code-mcp:ci "$IMAGE:latest"
          docker push "$IMAGE:latest"

      # Harbor keeps one image: every artifact that does not carry the tag latest (the previous latest, now untagged,
      # and any old version tag) is deleted. The robot account needs the "delete artifact" permission on the project;
      # without it this step only warns and the old images stay.
      - name: Delete the old images
        if: env.HAS_HARBOR == 'true'
        env:
          HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
          HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
          HOST: ${{ vars.HARBOR_HOST || 'harbor.ts-paas.com' }}
          PROJECT: ${{ vars.HARBOR_PROJECT || 'quality' }}
        run: |
          API="https://$HOST/api/v2.0/projects/$PROJECT/repositories/deploy-server/artifacts"
          json=$(curl -fsS -u "$HARBOR_USERNAME:$HARBOR_PASSWORD" "$API?page_size=100&with_tag=true") || { echo "::warning::could not list the artifacts, old images kept"; exit 0; }
          for digest in $(echo "$json" | jq -r '.[] | select(([.tags[]?.name] | index("latest")) | not) | .digest'); do
            if curl -fsS -o /dev/null -X DELETE -u "$HARBOR_USERNAME:$HARBOR_PASSWORD" "$API/$digest"; then
              echo "deleted $digest"
            else
              echo "::warning::could not delete $digest (the robot account needs the delete artifact permission)"
            fi
          done
          echo "left in Harbor:"
          curl -fsS -u "$HARBOR_USERNAME:$HARBOR_PASSWORD" "$API?page_size=100&with_tag=true" | jq -r '.[] | "\(.digest[0:19])  tags: \([.tags[]?.name] | join(","))"'

      - name: Summary
        run: |
          echo "Harbor now holds $IMAGE:latest only (version ${{ steps.version.outputs.value }}, commit ${GITHUB_SHA::7})" >> "$GITHUB_STEP_SUMMARY"
